# Checks every pull request, then uploads it as a preview version of the Worker (not deployed) and
# comments the preview link on the PR. Production deploys happen in deploy.yml.
name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
      - name: Site check (metadata and links)
        run: node scripts/check-site.mjs

      # Preview: a Worker version with its own URL. It uses the production bindings (leads database and
      # email), so a test lead sent from a preview is a real lead. Skipped for PRs from forks (no secrets).
      - name: Upload preview
        id: preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}" | tee upload.log
          url=$(grep -oE 'https://pr-[^ ]+\.workers\.dev' upload.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Check the preview
        if: steps.preview.outputs.url != ''
        run: node scripts/check-site.mjs --live "${{ steps.preview.outputs.url }}"
      - name: Comment the preview link
        if: steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="Preview of ${{ github.event.pull_request.head.sha }}: ${{ steps.preview.outputs.url }}
          Hebrew pages: ${{ steps.preview.outputs.url }}/automation · ${{ steps.preview.outputs.url }}/mobile"
          gh pr comment "${{ github.event.pull_request.number }}" --body "$body" --edit-last --create-if-none
