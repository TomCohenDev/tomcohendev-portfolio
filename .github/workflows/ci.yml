# Pull requests: lint, type check, build and site check. Cloudflare Workers Builds (connected to this
# repository in the Cloudflare dashboard) builds each branch as a preview version; once it has, the
# preview job runs the site check on the preview link.
name: CI

on:
  pull_request:

permissions:
  contents: read
  checks: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
      - name: Site check (metadata and links)
        run: node scripts/check-site.mjs

  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Wait for the Workers Builds preview
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-cloudflare-build.mjs "${{ github.event.pull_request.head.sha }}" --optional
      - name: Site check on the preview
        if: steps.build.outputs.url != ''
        run: node scripts/check-site.mjs --live "${{ steps.build.outputs.url }}"
