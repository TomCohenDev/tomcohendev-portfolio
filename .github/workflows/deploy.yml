# Deploys tomcohen.dev. Runs on every push to main, once a day (so posts dated in the future go live on
# their date), and by hand. Each run is recorded in the GitHub "production" environment; to roll back,
# run this workflow by hand on an earlier commit.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # 04:00 UTC: 07:00 in Israel in summer, 06:00 in winter.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://tomcohen.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Site check (metadata and links)
        run: node scripts/check-site.mjs
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --message "${{ github.sha }}"
      - name: Check the live site
        run: |
          sleep 10
          node scripts/check-site.mjs --live https://tomcohen.dev || (sleep 60 && node scripts/check-site.mjs --live https://tomcohen.dev)
