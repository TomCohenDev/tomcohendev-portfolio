<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 675" role="img" aria-labelledby="figure-title figure-desc" font-family="Arial, sans-serif"><title id="figure-title">Work across linked machines</title><desc id="figure-desc">Access grants define what can cross the boundary.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="var(--chart-1, #BF95F9)" stroke-width="1.5"/></marker></defs><text x="360" y="38" text-anchor="middle" fill="var(--foreground, #E0D0C1)" font-size="29" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Work across linked machines</text><text x="360" y="73" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="20" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Access grants define what can cross the boundary.</text><g class="node"><title>Machine A: parent thread: Local project + task context</title><rect x="95" y="110" width="530" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--chart-2, #F2C46D)" stroke-width="1.7"/><text x="360.0" y="145" text-anchor="middle" fill="var(--chart-2, #F2C46D)" font-size="27" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Machine A: parent thread</text><text x="360.0" y="177" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="21" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Local project + task context</text></g><path d="M360 202V241" fill="none" stroke="var(--chart-1, #BF95F9)" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>Kitshn access boundary: Shared card · grant · thread limits</title><rect x="95" y="249" width="530" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--chart-1, #BF95F9)" stroke-width="1.7"/><text x="360.0" y="284" text-anchor="middle" fill="var(--chart-1, #BF95F9)" font-size="27" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Kitshn access boundary</text><text x="360.0" y="316" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="21" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Shared card · grant · thread limits</text></g><path d="M360 341V380" fill="none" stroke="var(--chart-1, #BF95F9)" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>Machine B: delegated work: Its own checkout + installed tools</title><rect x="95" y="388" width="530" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--chart-1, #BF95F9)" stroke-width="1.7"/><text x="360.0" y="423" text-anchor="middle" fill="var(--chart-1, #BF95F9)" font-size="27" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Machine B: delegated work</text><text x="360.0" y="455" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="21" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Its own checkout + installed tools</text></g><path d="M360 480V519" fill="none" stroke="var(--chart-1, #BF95F9)" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>Completion reaches the parent: Continue with the returned result</title><rect x="95" y="527" width="530" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--success, #43B581)" stroke-width="1.7"/><text x="360.0" y="562" text-anchor="middle" fill="var(--success, #43B581)" font-size="27" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Completion reaches the parent</text><text x="360.0" y="594" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="21" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Continue with the returned result</text></g><text x="360" y="658" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="18" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Conceptual diagram · not live system data</text></svg>