<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 740" role="img" aria-labelledby="figure-title figure-desc" font-family="Arial, sans-serif"><title id="figure-title">Where the acceleration comes from</title><desc id="figure-desc">A workflow comparison, without invented speed metrics.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="var(--chart-1, #BF95F9)" stroke-width="1.5"/></marker></defs><text x="360" y="38" text-anchor="middle" fill="var(--foreground, #E0D0C1)" font-size="29" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Where the acceleration comes from</text><text x="360" y="73" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="20" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">A workflow comparison, without invented speed metrics.</text><text x="360" y="125" text-anchor="middle" fill="var(--chart-2, #F2C46D)" font-size="23" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">MANUAL COORDINATION</text><g class="node"><title>Rebuild context → pass work along: Repeat the brief and current state</title><rect x="65" y="151" width="590" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--chart-2, #F2C46D)" stroke-width="1.7"/><text x="360.0" y="186" text-anchor="middle" fill="var(--chart-2, #F2C46D)" font-size="27" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Rebuild context → pass work along</text><text x="360.0" y="218" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="21" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Repeat the brief and current state</text></g><path d="M360 243V274" fill="none" stroke="var(--chart-1, #BF95F9)" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>Check status → decide what is next: I move each handoff forward</title><rect x="65" y="282" width="590" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--chart-2, #F2C46D)" stroke-width="1.7"/><text x="360.0" y="317" text-anchor="middle" fill="var(--chart-2, #F2C46D)" font-size="27" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Check status → decide what is next</text><text x="360.0" y="349" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="21" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">I move each handoff forward</text></g><text x="360" y="433" text-anchor="middle" fill="var(--chart-1, #BF95F9)" font-size="23" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">WITH A HARNESS + ORCHESTRATION</text><g class="node"><title>Persistent task → bounded handoff: Context travels with the work</title><rect x="65" y="461" width="590" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--chart-1, #BF95F9)" stroke-width="1.7"/><text x="360.0" y="496" text-anchor="middle" fill="var(--chart-1, #BF95F9)" font-size="27" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Persistent task → bounded handoff</text><text x="360.0" y="528" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="21" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Context travels with the work</text></g><path d="M360 553V584" fill="none" stroke="var(--chart-1, #BF95F9)" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>Event returns → I assess the result: Attention goes to the next decision</title><rect x="65" y="592" width="590" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--success, #43B581)" stroke-width="1.7"/><text x="360.0" y="627" text-anchor="middle" fill="var(--success, #43B581)" font-size="27" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Event returns → I assess the result</text><text x="360.0" y="659" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="21" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Attention goes to the next decision</text></g><text x="360" y="723" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="18" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Conceptual diagram · not live system data</text></svg>