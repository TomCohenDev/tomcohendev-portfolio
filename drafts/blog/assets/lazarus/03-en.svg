ont-size="20" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Diff against the base · audit the weights</text></g><path d="M360 320V339" fill="none" stroke="#BF95F9" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>Before a command runs: Approval for high-impact actions</title><rect x="70" y="346" width="580" height="92" rx="16" fill="#222524" stroke="#F2C46D" stroke-width="1.7"/><text x="360.0" y="381" text-anchor="middle" fill="#F2C46D" font-size="26" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Before a command runs</text><text x="360.0" y="413" text-anchor="middle" fill="#B9BBBE" font-size="20" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Approval for high-impact actions</text></g><path d="M360 438V457" fill="none" stroke="#BF95F9" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>While it runs: Sandbox · no secrets · egress allowlist</title><rect x="70" y="464" width="580" height="92" rx="16" fill="#222524" stroke="#F2C46D" stroke-width="1.7"/><text x="360.0" y="499" text-anchor="middle" fill="#F2C46D" font-size="26" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">While it runs</text><text x="360.0" y="531" text-anchor="middle" fill="#B9BBBE" font-size="20" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Sandbox · no secrets · egress allowlist</text></g><path d="M360 556V575" fill="none" stroke="#BF95F9" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>Afterwards: Logs of commands, files and network calls</title><rect x="70" y="582" width="580" height="92" rx="16" fill="#222524" stroke="#43B581" stroke-width="1.7"/><text x="360.0" y="617" text-anchor="middle" fill="#43B581" font-size="26" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Afterwards</text><text 