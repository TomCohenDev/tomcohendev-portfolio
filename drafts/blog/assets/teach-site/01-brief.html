<!doctype html>
<meta charset="utf-8" />
<title>From a brief to a scene</title>
<link rel="stylesheet" href="kit.css" />
<style>
  .lines .row { margin-bottom: 6px; }
  .tool b { font-weight: 600; color: var(--term-ink); }
  .bullet { display: inline-block; width: 18px; }
  #prompt { position: absolute; left: 20px; right: 20px; bottom: 18px; }
  .hintline { position: absolute; left: 22px; bottom: 82px; color: var(--term-dim); font-size: 12.5px; }
  svg text { font-family: "Nunito", "Rubik", sans-serif; }
</style>
<body>
  <div class="win" id="term" style="left:40px;top:40px;width:640px;height:640px">
    <div class="bar dark"><div class="dots"><i></i><i></i><i></i></div><span class="title">claude · ~/teach</span></div>
    <div class="term">
      <div class="lines" id="lines"></div>
      <div id="prompt" class="prompt-box"><span class="acc">&gt; </span><span id="typed"></span><span class="caret" id="caret"></span></div>
    </div>
  </div>
  <div class="win" id="browser" style="left:600px;top:206px;width:640px;height:474px">
    <div class="bar"><div class="dots"><i></i><i></i><i></i></div><div class="url">localhost:3000/p/<b>hyd-pascal</b></div></div>
    <div class="paper" id="paper">
      <div id="head" style="position:absolute;top:24px;width:300px">
        <div class="kicker" id="kicker" style="font-size:14px"></div>
        <div class="h1" id="title" style="font-size:30px"></div>
        <div id="sub" style="font:400 15px/1.5 Rubik;color:#3c3a48;margin-top:10px"></div>
      </div>
      <svg id="dia" width="290" height="380" viewBox="0 0 290 380" direction="ltr" style="position:absolute;top:24px"></svg>
    </div>
  </div>
  <script type="module">
    import { clip, he, tr, prog, ease, easeOut, lerp, clamp, typed, caretOn, $ } from "./kit.js";

    const PROMPT = "Turn my deck on Pascal's law (slides/pascal.pdf) into a Stage lesson. Hebrew, speaker notes on every scene, every number from physics.ts.";
    const T_TYPE = 0.4, CPS = 34, T_ENTER = T_TYPE + PROMPT.length / CPS + 0.35;
    const STEPS = [
      ["say", "I'll read the deck and the course conventions first."],
      ["tool", "Read", "slides/pascal.pdf"],
      ["tool", "Read", "CLAUDE.md, .claude/skills/new-presentation"],
      ["tool", "Write", "content/presentations/hyd-pascal/physics.ts"],
      ["tool", "Write", "content/presentations/hyd-pascal/scenes.tsx"],
      ["tool", "Bash", "pnpm test hyd-pascal", "✓ passed"],
      ["note", "The deck says A = πd². The area is πd²/4; the scene uses that."],
      ["tool", "Preview", "localhost:3000/p/hyd-pascal"],
    ];
    const lines = $("#lines");
    const echo = document.createElement("div");
    echo.className = "row dim";
    echo.textContent = "> " + PROMPT;
    lines.append(echo);
    const els = STEPS.map((s) => {
      const r = document.createElement("div");
      r.className = "row";
      if (s[0] === "say") r.innerHTML = `<span class="bullet">●</span>${s[1]}`;
      if (s[0] === "note") r.innerHTML = `<span class="bullet acc">●</span><span class="acc">${s[1]}</span>`;
      if (s[0] === "tool") r.innerHTML = `<span class="bullet b"></span><span class="tool"><b>${s[1]}</b> <span class="dim">${s[2]}</span>${s[3] ? ` <span class="ok">${s[3]}</span>` : ""}</span>`;
      lines.append(r);
      return r;
    });
    const T_STEP = (i) => T_ENTER + 0.45 + i * 0.5;

    // browser: the first scene of the real lesson ("how do you lift a car with one hand")
    const paper = $("#paper");
    paper.dir = he ? "rtl" : "ltr";
    $("#head").style[he ? "right" : "left"] = "26px";
    $("#dia").style[he ? "left" : "right"] = "14px";
    $("#kicker").textContent = tr({ he: "הידרוסטטיקה · חוק פסקל", en: "Hydrostatics · Pascal's law" });
    $("#title").textContent = tr({ he: "איך מרימים מכונית ביד אחת?", en: "How do you lift a car with one hand?" });
    $("#sub").innerHTML = tr({
      he: 'במוסך מרימים מכונית של <span class="ltr">1,800 kg</span>. אף אחד לא מרים אותה בידיים, ובכל זאת כוח של יד עושה את זה.',
      en: "A garage lifts a 1,800 kg car. Nobody lifts it by hand, and yet the force of one hand does it.",
    });

    const NS = "http://www.w3.org/2000/svg";
    const dia = $("#dia");
    const el = (tag, at, parent = dia) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); parent.append(e); return e; };
    const BOT = 350, CH = 300;
    const oilBig = el("rect", { x: 20, width: 140, fill: "#f6edc4" });
    el("rect", { x: 160, y: CH, width: 92, height: BOT - CH, fill: "#f6edc4" });
    const oilSmall = el("rect", { x: 252, width: 22, fill: "#f6edc4" });
    el("path", { d: `M20 120 V${BOT} H274 V120`, fill: "none", stroke: "#2b2a30", "stroke-width": 3.5, "stroke-linejoin": "round" });
    el("path", { d: `M160 120 V${CH} H252 V120`, fill: "none", stroke: "#2b2a30", "stroke-width": 3.5, "stroke-linejoin": "round" });
    const bigP = el("rect", { x: 22, width: 136, height: 14, rx: 3, fill: "#cfd3dc", stroke: "#6b6f7c", "stroke-width": 2 });
    const car = el("g", {});
    el("path", { d: "M18 0 Q22 -26 50 -28 L88 -28 Q104 -28 114 -12 L128 -10 Q136 -8 136 2 L136 8 L8 8 L8 2 Q8 -2 18 0 Z", fill: "#514fbb" }, car);
    el("path", { d: "M44 -24 L58 -24 L58 -10 L34 -10 Q36 -22 44 -24 Z M64 -24 L86 -24 Q98 -24 106 -10 L64 -10 Z", fill: "#e6e4ff" }, car);
    el("circle", { cx: 36, cy: 10, r: 9, fill: "#2b2a30" }, car);
    el("circle", { cx: 108, cy: 10, r: 9, fill: "#2b2a30" }, car);
    const smallP = el("rect", { x: 254, width: 18, height: 12, rx: 2, fill: "#cfd3dc", stroke: "#6b6f7c", "stroke-width": 2 });
    const rod = el("rect", { x: 259, width: 8, height: 64, fill: "#cfd3dc", stroke: "#6b6f7c", "stroke-width": 2 });
    const arrow = el("path", { fill: "#c2410c" });
    const f1 = el("text", { "font-size": 14, "font-weight": 800, fill: "#2b2a30", "text-anchor": "end" });
    const f2 = el("text", { x: 90, "font-size": 14, "font-weight": 800, fill: "#2b2a30", "text-anchor": "middle" });

    clip({
      duration: 12.5,
      poster: 11.6,
      seek(t) {
        // terminal
        const typing = t >= T_TYPE && t < T_ENTER;
        $("#typed").textContent = t < T_ENTER ? typed(PROMPT, t, T_TYPE, CPS) : "";
        $("#caret").style.opacity = caretOn(t, typing) ? 1 : 0;
        echo.style.display = t >= T_ENTER ? "block" : "none";
        els.forEach((r, i) => {
          const t0 = T_STEP(i);
          r.style.display = t >= t0 ? "block" : "none";
          r.style.opacity = String(clamp((t - t0) / 0.15));
          const b = r.querySelector(".bullet.b");
          if (b) {
            const done = t >= t0 + 0.35;
            b.textContent = done ? "●" : ["◐", "◓", "◑", "◒"][Math.floor(t * 12) % 4];
            b.className = "bullet b " + (done ? "ok" : "dim");
          }
        });

        // browser enters after "Preview"
        const tb = T_STEP(STEPS.length - 1) + 0.3;
        const k = easeOut(prog(t, tb, tb + 0.7));
        const br = $("#browser");
        br.style.opacity = String(k);
        br.style.transform = `translateY(${(1 - k) * 40}px) scale(${0.96 + 0.04 * k})`;
        // the terminal starts centred and moves aside for the browser
        $("#term").style.transform = `translateX(${(1 - ease(prog(t, tb - 0.2, tb + 0.6))) * 280}px)`;

        // the jack: pump strokes push the small piston, the car rises a little on every stroke
        const tp = tb + 0.9, period = 0.9;
        const n = Math.max(0, (t - tp) / period);
        const phase = n % 1, strokes = Math.floor(n);
        const push = t < tp ? 0 : Math.sin(Math.PI * clamp(phase / 0.7)) * (phase < 0.7 ? 1 : 0);
        const lift = Math.min(3, strokes + clamp(phase / 0.7)) * 9;
        const yS = 190 + push * 40, yB = 200 - lift;
        oilBig.setAttribute("y", yB); oilBig.setAttribute("height", BOT - yB);
        oilSmall.setAttribute("y", yS); oilSmall.setAttribute("height", BOT - yS);
        bigP.setAttribute("y", yB - 14);
        car.setAttribute("transform", `translate(18 ${yB - 32})`);
        smallP.setAttribute("y", yS - 12);
        rod.setAttribute("y", yS - 76);
        const ay = yS - 82;
        arrow.setAttribute("d", `M260 ${ay - 34} h6 v24 h7 l-10 12 l-10 -12 h7 z`);
        f1.setAttribute("x", 250); f1.setAttribute("y", ay - 20); f1.textContent = "F₁ = 180 N";
        f2.setAttribute("y", BOT - 16); f2.textContent = "F₂ = 18,000 N";
      },
    });
  </script>
</body>
