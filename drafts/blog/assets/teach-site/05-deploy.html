<!doctype html>
<meta charset="utf-8" />
<title>Publish without a domain</title>
<link rel="stylesheet" href="kit.css" />
<style>
  .row { min-height: 23px; }
  #phone { position: absolute; left: 870px; top: 34px; width: 330px; height: 652px; border-radius: 46px; background: #0f0e12; padding: 12px; box-shadow: 0 30px 70px rgba(0,0,0,.5), 0 0 0 2px #2a2830; }
  #screen { width: 100%; height: 100%; border-radius: 36px; overflow: hidden; position: relative; background-color: var(--paper); background-image: radial-gradient(var(--dot) 1.1px, transparent 1.2px); background-size: 18px 18px; }
  .pbar { position: relative; z-index: 2; height: 64px; padding: 26px 14px 0; background: #f1f0f5; border-bottom: 1px solid #e0dee8; direction: ltr; }
  .pbar .url { margin: 0; height: 28px; line-height: 28px; font-size: 12px; text-align: center; border-radius: 10px; }
  #load { position: absolute; z-index: 3; top: 63px; left: 0; height: 3px; background: var(--primary); }
  #feed { position: absolute; top: 76px; left: 0; right: 0; padding: 0 14px; }
  .sc { background: #fff; border-radius: 20px; box-shadow: 0 6px 18px rgba(60, 52, 140, .08); margin-bottom: 14px; overflow: hidden; }
  .sc .fr { height: 150px; border-bottom: 1px solid #eceaf3; background-color: #fafafc; background-image: radial-gradient(#e2e1ea 1px, transparent 1.1px); background-size: 12px 12px; position: relative; }
  .sc .nt { padding: 12px 16px 14px; font: 400 13.5px/1.6 "Rubik"; color: #3c3a48; }
  .sc .nt b { display: block; font: 700 15px "Rubik"; color: var(--ink); margin-bottom: 2px; }
  .ph { font: 700 13px "Nunito", "Rubik"; color: var(--primary); }
  .pt { font: 800 24px/1.15 "Rubik"; margin: 2px 0 12px; color: var(--ink); }
</style>
<body>
  <div class="win" style="left:40px;top:40px;width:780px;height:640px">
    <div class="bar dark"><div class="dots"><i></i><i></i><i></i></div><span class="title">~/my-lessons</span></div>
    <div class="term" id="term"></div>
  </div>
  <div id="phone"><div id="screen">
    <div class="pbar"><div class="url" id="purl"></div></div>
    <div id="load"></div>
    <div id="feed"></div>
  </div></div>
  <script type="module">
    import { clip, he, tr, prog, ease, easeOut, clamp, typed, caretOn, $ } from "./kit.js";

    const URL_ = "my-lessons.your-name.workers.dev";
    // [type, text, t] — "cmd" is typed, "out" appears at t.
    const SCRIPT = [
      ["cmd", "ls site", 0.3],
      ["out", '<span class="dim">index.html  hydraulics/  thermodynamics/  print.css</span>', 0.85],
      ["cmd", "cat wrangler.jsonc", 1.3],
      ["out", '{ <span class="acc">"name"</span>: "my-lessons",', 2.05],
      ["out", '  <span class="acc">"compatibility_date"</span>: "2026-11-01",', 2.1],
      ["out", '  <span class="acc">"assets"</span>: { <span class="acc">"directory"</span>: "./site" } }', 2.15],
      ["cmd", "npx wrangler deploy", 2.8],
      ["spin", "Uploading static assets", 3.75, 4.9],
      ["out", 'Deployed <b>my-lessons</b>', 5.1],
      ["out", `  <span class="ok">https://${URL_}</span>`, 5.3],
      ["cmd", "", 5.6],
    ];
    const term = $("#term");
    const rows = SCRIPT.map((s) => { const r = document.createElement("div"); r.className = "row"; term.append(r); return r; });
    const CPS = 22;

    $("#purl").textContent = URL_;
    $("#screen").dir = he ? "rtl" : "ltr";
    const fig = {
      press: `<svg viewBox="0 0 300 150" width="100%" height="150" direction="ltr"><rect x="70" y="62" width="70" height="66" fill="#f6edc4"/><rect x="140" y="104" width="76" height="24" fill="#f6edc4"/><rect x="216" y="70" width="14" height="58" fill="#f6edc4"/><path d="M70 30 V128 H230 V30 M140 30 V104 H216 V30" fill="none" stroke="#2b2a30" stroke-width="3"/><rect x="72" y="54" width="66" height="8" fill="#cfd3dc" stroke="#6b6f7c"/><rect x="84" y="32" width="42" height="20" rx="5" fill="#e6e4ff" stroke="#514fbb" stroke-width="2"/><path d="M223 22 V56" stroke="#c2410c" stroke-width="4"/><path d="M217 52 h12 l-6 9z" fill="#c2410c"/></svg>`,
      pv: `<svg viewBox="0 0 300 150" width="100%" height="150" direction="ltr"><path d="M60 20 V130 H260" fill="none" stroke="#2b2a30" stroke-width="2.5"/><path d="M80 24 C 90 70 150 110 240 118 L240 126 C 160 122 100 110 80 86 Z" fill="#e6e4ff" stroke="#514fbb" stroke-width="3"/><circle cx="80" cy="24" r="4" fill="#2b2a30"/><circle cx="240" cy="118" r="4" fill="#2b2a30"/></svg>`,
      gh: `<svg viewBox="0 0 300 150" width="100%" height="150" direction="ltr"><line x1="20" y1="128" x2="280" y2="128" stroke="#8a7a5c" stroke-width="2"/><circle cx="46" cy="34" r="16" fill="#f6c443"/><path d="M120 128 V72 L190 40 L260 72 V128" fill="#eaf3fd" stroke="#3a7bd5" stroke-width="3"/><rect x="66" y="84" width="40" height="18" rx="9" fill="#22212a"/>${[140, 162, 184, 206, 228].map((x) => `<circle cx="${x}" cy="120" r="7" fill="#5a9e4b"/>`).join("")}</svg>`,
    };
    const CARDS = [
      ["press", tr({ he: "המכבש ההידראולי", en: "The hydraulic press" }), tr({ he: "שתי בוכנות על אותו שמן. הלחץ מתחת לשתיהן שווה, ולכן הכוח גדל פי יחס השטחים.", en: "Two pistons on the same oil. The pressure under both is equal, so the force grows by the ratio of the areas." })],
      ["pv", tr({ he: "מחזור אוטו בדיאגרמת p-V", en: "The Otto cycle on a p-V diagram" }), tr({ he: "השטח שבתוך המחזור הוא העבודה נטו של מחזור אחד.", en: "The area inside the cycle is the net work of one cycle." })],
      ["gh", tr({ he: "מבחן: חממה בערבה", en: "Test: a greenhouse in the Arava" }), tr({ he: "מיכל אוויר שחור בשמש פותח את חלון האוורור, בלי חשמל.", en: "A black air tank in the sun opens the roof vent, with no electricity." })],
    ];
    $("#feed").innerHTML =
      `<div class="ph">${tr({ he: "מצב קריאה", en: "Reading mode" })}</div><div class="pt">${tr({ he: "השיעורים שלי", en: "My lessons" })}</div>` +
      CARDS.map(([f, h, n]) => `<div class="sc"><div class="fr">${fig[f]}</div><div class="nt"><b>${h}</b>${n}</div></div>`).join("");

    clip({
      duration: 11,
      poster: 7.4,
      seek(t) {
        let last = -1;
        SCRIPT.forEach((s, i) => {
          const r = rows[i];
          const [kind, text, t0] = s;
          r.style.display = t >= t0 ? "block" : "none";
          if (t < t0) return;
          last = i;
          if (kind === "cmd") {
            const next = SCRIPT[i + 1]?.[2] ?? 99;
            const shown = typed(text, t, t0 + 0.1, CPS);
            const typing = shown.length < text.length;
            const caret = t < next ? `<span class="caret" style="opacity:${caretOn(t, typing) ? 1 : 0}"></span>` : "";
            r.innerHTML = `<span class="ok">$</span> ${shown}${caret}`;
          } else if (kind === "spin") {
            const done = t >= s[3];
            r.innerHTML = done ? `<span class="ok">✓</span> ${text}` : `<span class="dim">${["◐", "◓", "◑", "◒"][Math.floor(t * 12) % 4]}</span> ${text}<span class="dim">${".".repeat(1 + (Math.floor(t * 3) % 3))}</span>`;
          } else r.innerHTML = text;
        });
        void last;

        // phone arrives with the URL, loads, then the reader scrolls
        const k = easeOut(prog(t, 5.6, 6.3));
        $("#phone").style.opacity = String(k);
        $("#phone").style.transform = `translateY(${(1 - k) * 60}px)`;
        const ld = prog(t, 6.3, 6.9);
        $("#load").style.width = `${ld * 100}%`;
        $("#load").style.opacity = ld >= 1 ? "0" : "1";
        $("#feed").style.opacity = String(prog(t, 6.6, 6.9));
        $("#feed").style.transform = `translateY(${-ease(prog(t, 7.6, 10.2)) * 330}px)`;
      },
    });
  </script>
</body>
