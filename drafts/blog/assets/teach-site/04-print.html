<!doctype html>
<meta charset="utf-8" />
<title>Print to PDF</title>
<link rel="stylesheet" href="kit.css" />
<style>
  .stage { flex: 1; position: relative; background: #eceaf3; overflow: hidden; }
  .a4 { position: absolute; background: #fff; box-shadow: 0 8px 30px rgba(45, 40, 90, .14); color: var(--ink); overflow: hidden; }
  .a4 .h { font: 800 25px/1.2 "Rubik"; border-bottom: 3px solid var(--ink); padding-bottom: 10px; }
  .a4 .m { font: 400 14px/1.5 "Rubik"; color: #4a4a58; margin-top: 6px; }
  .a4 .q { font: 700 17px "Rubik"; margin-top: 14px; }
  .a4 p { font: 400 14.5px/1.65 "Rubik"; margin: 6px 0; }
  .a4 .fields { display: flex; gap: 22px; font: 500 13px "Rubik"; color: #4a4a58; margin-top: 10px; }
  .a4 .fields span { border-bottom: 1px solid #b9b7c8; padding-bottom: 2px; min-width: 120px; }
  .float { position: absolute; top: 18px; display: flex; gap: 10px; }
  #shade { position: absolute; inset: 0; background: rgba(20, 18, 30, .42); }
  #dlg { position: absolute; left: 50%; top: 50%; width: 860px; height: 500px; margin: -250px 0 0 -430px; border-radius: 18px; background: #fff; display: flex; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.35); direction: ltr; }
  #dlg .pv { flex: 1; background: #e3e2ea; position: relative; overflow: hidden; }
  #dlg .set { width: 320px; padding: 22px 24px; font: 500 15px "Nunito", "Rubik"; color: #3c3a48; display: flex; flex-direction: column; gap: 14px; }
  #dlg .set h3 { margin: 0 0 4px; font: 800 20px "Nunito"; color: var(--ink); }
  .opt { display: flex; justify-content: space-between; align-items: center; }
  .sel { border: 1px solid #d6d4e2; border-radius: 10px; padding: 6px 12px; min-width: 150px; font-weight: 700; color: var(--ink); }
  .btns { margin-top: auto; display: flex; justify-content: flex-end; gap: 10px; }
  .mini { position: absolute; background: #fff; box-shadow: 0 4px 14px rgba(40, 30, 90, .18); }
  .mini i { display: block; height: 5px; border-radius: 3px; background: #d8d6e4; margin: 7px 14px; }
  .mini i.k { background: #2b2a30; height: 8px; margin-top: 16px; }
  #chip { position: absolute; bottom: 20px; display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 12px; border-radius: 14px; background: #fff; box-shadow: 0 10px 30px rgba(40, 30, 90, .2); font: 700 15px "Nunito"; direction: ltr; }
  #chip .ic { width: 34px; height: 40px; border-radius: 6px; background: #d1495b; color: #fff; display: grid; place-items: center; font: 800 11px "Nunito"; }
  #chip small { display: block; font: 500 12.5px "Nunito"; color: #6b6880; }
</style>
<body>
  <div class="win" style="left:40px;top:40px;width:1200px;height:640px">
    <div class="bar"><div class="dots"><i></i><i></i><i></i></div><div class="url"><b>teach.tom-cohen.com</b>/files/thermodynamics/tests/greenhouse-test.html</div></div>
    <div class="stage" id="stage">
      <div class="a4" id="page" style="left:330px;top:24px;width:540px;height:760px;padding:34px 40px">
        <div class="h" id="h"></div>
        <div class="m" id="m"></div>
        <div class="fields" id="fields"></div>
        <div class="q" id="q"></div>
        <p id="p1"></p>
        <svg viewBox="0 0 460 170" width="460" height="170" style="display:block;margin:6px 0" id="gh"></svg>
        <p id="cap" style="font-size:12.5px;color:#4a4a58"></p>
      </div>
      <div class="float" id="float"><span class="btn" id="pdf">PDF</span></div>
      <div id="shade"></div>
      <div id="dlg">
        <div class="pv" id="pv"></div>
        <div class="set">
          <h3 id="dlgT"></h3>
          <div class="opt"><span id="o1"></span><span class="sel" id="s1"></span></div>
          <div class="opt"><span id="o2"></span><span class="sel" id="s2"></span></div>
          <div class="opt"><span id="o3"></span><span class="sel">A4</span></div>
          <div class="opt"><span id="o4"></span><span class="sel" id="s4"></span></div>
          <div class="btns"><span class="btn" id="cancel"></span><span class="btn primary" id="save"></span></div>
        </div>
      </div>
      <div id="chip"><div class="ic">PDF</div><div>greenhouse-test.pdf<small id="chipS"></small></div></div>
    </div>
  </div>
  <script type="module">
    import { clip, he, tr, prog, ease, easeOut, clamp, makeCursor, $ } from "./kit.js";

    const stage = $("#stage");
    $("#page").dir = he ? "rtl" : "ltr";
    $("#float").style[he ? "left" : "right"] = "20px";
    $("#chip").style[he ? "left" : "right"] = "20px";
    $("#h").textContent = tr({ he: "מבחן בתרמודינמיקה: חממה בערבה", en: "Thermodynamics test: a greenhouse in the Arava" });
    $("#m").textContent = tr({ he: "תהליכים בגזים, החוק הראשון, מחזור ומעבר חום · שאלה אחת · 100 נקודות", en: "Gas processes, the first law, a cycle and heat transfer · one question · 100 points" });
    $("#fields").innerHTML = tr({ he: "<span>שם:</span><span>כיתה:</span><span>תאריך:</span>", en: "<span>Name:</span><span>Class:</span><span>Date:</span>" });
    $("#q").textContent = tr({ he: "שאלה 1: פרויקט ״חממה בערבה״", en: "Question 1: the \"greenhouse in the Arava\" project" });
    $("#p1").textContent = tr({
      he: "אתם צוות ההנדסה של חברה שמקימה חממות בערבה. ביום השמש מחממת את החממה מעבר לרצוי, והחקלאי מבקש פתרון שיפתח את חלון האוורור לבד, בלי חשמל ובלי בקר.",
      en: "You are the engineering team of a company that builds greenhouses in the Arava. By day the sun overheats the greenhouse, and the farmer wants the roof vent to open by itself, with no electricity and no controller.",
    });
    $("#cap").textContent = tr({ he: "תרשים 1: חתך החממה. המיכל השחור עומד בשמש ומחובר בצינור לגליל שבתוך החממה.", en: "Figure 1: the greenhouse in section. The black tank stands in the sun and is piped to the cylinder inside." });

    // greenhouse figure (no labels, so it works in both languages)
    $("#gh").innerHTML = `
      <line x1="0" y1="160" x2="460" y2="160" stroke="#8a7a5c" stroke-width="2"/>
      <circle cx="48" cy="34" r="22" fill="#f6c443"/>
      <path d="M200 160 V82 L310 36 L420 82 V160" fill="#eaf3fd" stroke="#3a7bd5" stroke-width="4" stroke-linejoin="round"/>
      <line x1="310" y1="36" x2="384" y2="14" stroke="#3a7bd5" stroke-width="4" stroke-linecap="round"/>
      <rect x="350" y="70" width="20" height="44" rx="4" fill="#dcdde6" stroke="#2b2a30" stroke-width="2"/>
      <line x1="360" y1="70" x2="360" y2="26" stroke="#5d5b6c" stroke-width="3"/>
      <rect x="96" y="96" width="70" height="30" rx="15" fill="#22212a"/>
      <line x1="112" y1="126" x2="112" y2="160" stroke="#5d5b6c" stroke-width="4"/><line x1="150" y1="126" x2="150" y2="160" stroke="#5d5b6c" stroke-width="4"/>
      <path d="M166 111 H226 V136 H360 V114" fill="none" stroke="#22212a" stroke-width="3"/>
      ${[230, 262, 294, 326, 358, 390].map((x) => `<circle cx="${x}" cy="146" r="11" fill="#5a9e4b"/>`).join("")}`;

    // print dialog (the browser's own; drawn generic)
    $("#dlgT").textContent = tr({ he: "הדפסה", en: "Print" });
    $("#o1").textContent = tr({ he: "יעד", en: "Destination" });
    $("#s1").innerHTML = tr({ he: 'שמירה כ־<span class="ltr">PDF</span>', en: "Save as PDF" });
    $("#o2").textContent = tr({ he: "עמודים", en: "Pages" });
    $("#s2").textContent = tr({ he: "הכול", en: "All" });
    $("#o3").textContent = tr({ he: "גודל נייר", en: "Paper size" });
    $("#o4").textContent = tr({ he: "גרפיקת רקע", en: "Background graphics" });
    $("#s4").textContent = tr({ he: "כן", en: "On" });
    $("#cancel").textContent = tr({ he: "ביטול", en: "Cancel" });
    $("#save").textContent = tr({ he: "שמירה", en: "Save" });
    $("#chipS").textContent = tr({ he: "נשמר · A4", en: "Saved · A4" });
    $("#dlg").dir = he ? "rtl" : "ltr";
    $("#dlg").style.direction = he ? "rtl" : "ltr";
    const pv = $("#pv");
    const minis = [0, 1, 2, 3].map((i) => {
      const m = document.createElement("div");
      m.className = "mini";
      m.style.cssText = `width:200px;height:283px;left:${42 + (i % 2) * 230}px;top:${30 + Math.floor(i / 2) * 310}px`;
      m.innerHTML = `<i class="k" style="width:${i ? 50 : 70}%"></i>` + Array.from({ length: 14 }, (_, j) => `<i style="width:${55 + ((j * 37 + i * 11) % 40)}%"></i>`).join("");
      if (i === 0) m.innerHTML += `<div style="margin:10px 14px;height:62px;border-radius:6px;background:#eaf3fd;border:2px solid #3a7bd5"></div>`;
      pv.append(m);
      return m;
    });

    // positions on the page (stage origin = 40, 78)
    const pdfR = $("#pdf").getBoundingClientRect();
    const saveR = $("#save").getBoundingClientRect();
    const P = (r) => [r.left + r.width / 2, r.top + r.height / 2];
    const [px, py] = P(pdfR);
    const cursor = makeCursor([
      [0.3, 640, 600],
      [1.6, px, py],
      [1.9, px, py, true],
      [3.0, 900, 420],
      [4.4, ...P(saveR)],
      [4.7, ...P(saveR), true],
      [6.0, he ? 300 : 980, 560],
      [9, he ? 300 : 980, 560],
    ]);

    clip({
      duration: 9,
      poster: 3.6,
      seek(t) {
        // scrolling the page a little while the reader looks at it
        $("#page").style.transform = `translateY(${-ease(prog(t, 0.2, 1.4)) * 40}px)`;
        const open = easeOut(prog(t, 2.0, 2.4)) * (1 - prog(t, 4.75, 5.05));
        $("#shade").style.opacity = String(open);
        const dlg = $("#dlg");
        dlg.style.opacity = String(open);
        dlg.style.transform = `scale(${0.96 + 0.04 * open})`;
        dlg.style.display = open > 0 ? "flex" : "none";
        // preview scrolls through the pages
        const sc = ease(prog(t, 2.6, 4.0)) * 260;
        minis.forEach((m) => (m.style.transform = `translateY(${-sc}px)`));
        cursor(t);
        const chip = easeOut(prog(t, 5.2, 5.6));
        $("#chip").style.opacity = String(chip);
        $("#chip").style.transform = `translateY(${(1 - chip) * 30}px)`;
      },
    });
  </script>
</body>
