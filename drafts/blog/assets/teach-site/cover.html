<!doctype html>
<meta charset="utf-8" />
<title>Cover</title>
<link rel="stylesheet" href="kit.css" />
<style>
  html, body { width: 1600px; height: 840px; }
  .frame { position: absolute; border-radius: 16px; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06); }
  .frame iframe { border: 0; width: 1280px; height: 720px; transform-origin: 0 0; display: block; }
</style>
<body>
  <!-- Two clip frames at their poster moments: the 3D engine and the hydraulic press. -->
  <div class="frame" style="left:90px;top:100px;width:837px;height:446px"><iframe id="a"></iframe></div>
  <div class="frame" style="left:660px;top:290px;width:837px;height:446px"><iframe id="b"></iframe></div>
  <script type="module">
    const lang = new URLSearchParams(location.search).get("lang") === "he" ? "he" : "en";
    const S = 893 / 1280;
    // the 3D engine sits at the far side of its window, so mirror the layout per language
    if (lang === "en") {
      const [fa, fb] = document.querySelectorAll(".frame");
      fa.style.left = "660px"; fb.style.left = "90px";
    }
    const load = (id, src, t) => new Promise((ok) => {
      const f = document.getElementById(id);
      f.style.transform = `scale(${S})`;
      f.onload = async () => { await f.contentWindow.clipReady; f.contentWindow.seek(t); ok(); };
      f.src = `${src}?lang=${lang}`;
    });
    window.clipDuration = 0;
    window.clipReady = Promise.all([load("a", "03-engine.html", 3.25), load("b", "02-press.html", 8.5)]).then(() => {
      // crop the desktop around each clip's window
      for (const f of document.querySelectorAll("iframe")) {
        f.style.margin = `${-40 * S}px 0 0 ${-40 * S}px`;
        for (const id of ["cursor", "ripple"]) f.contentDocument.getElementById(id)?.remove();
      }
      return true;
    });
    window.seek = () => {};
  </script>
</body>
