<!doctype html>
<meta charset="utf-8" />
<title>Otto cycle engine</title>
<link rel="stylesheet" href="kit.css" />
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
<style>
  #gl { position: absolute; top: 20px; width: 430px; height: 560px; }
  .side { position: absolute; top: 34px; width: 690px; }
  .strokes { margin-top: 18px; display: grid; gap: 8px; width: 300px; }
  .st { display: flex; gap: 12px; align-items: center; padding: 9px 12px; border-radius: 18px; transition: none; }
  .st .num { width: 38px; height: 38px; flex: none; border-radius: 12px; display: grid; place-items: center; font: 800 19px "Nunito"; background: #eeedf3; color: #4a4858; }
  .st .nm { font: 700 20px "Rubik"; color: #4a4858; }
  .st .vl { font: 400 14px "Rubik"; color: #6b6880; }
  .st.on { background: #fff; box-shadow: 0 8px 22px rgba(60, 52, 140, .12); }
  .st.on .num { background: var(--primary); color: #fff; }
  .st.on .nm { color: var(--ink); }
  .chart { position: absolute; top: 116px; width: 370px; }
  .chart svg text { font-family: "Nunito", sans-serif; }
  .read { display: flex; gap: 18px; justify-content: center; font: 700 17px "Nunito"; color: #3c3a48; margin-top: 4px; direction: ltr; }
  .read b { color: var(--primary); }
  .hint { position: absolute; bottom: 22px; font: 400 14px "Rubik"; color: #6b6880; }
</style>
<body>
  <div class="win" style="left:40px;top:40px;width:1200px;height:640px">
    <div class="bar"><div class="dots"><i></i><i></i><i></i></div><div class="url"><b>teach.tom-cohen.com</b>/p/otto-cycle</div></div>
    <div class="paper" id="paper">
      <canvas id="gl" width="430" height="560"></canvas>
      <div class="hint" id="hint"></div>
      <div class="side" id="side">
        <div class="kicker" id="kicker"></div>
        <div class="h1" id="title"></div>
        <div class="strokes" id="strokes"></div>
        <div class="chart" id="chart">
          <svg id="pv" width="370" height="300" viewBox="0 0 370 300" direction="ltr"></svg>
          <div class="read"><span>p = <b id="pR"></b> bar</span><span>T = <b id="tR"></b> K</span></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import * as THREE from "three";
    import { clip, he, tr, prog, ease, lerp, clamp, makeCursor, $ } from "./kit.js";

    const W = { x: 40, y: 78 };
    $("#paper").dir = he ? "rtl" : "ltr";
    $("#kicker").textContent = tr({ he: "מנוע ארבע פעימות", en: "Four-stroke engine" });
    $("#title").textContent = tr({ he: "מחזור אוטו", en: "The Otto cycle" });
    $("#hint").textContent = tr({ he: "גררו כדי לסובב", en: "Drag to rotate" });
    // 3D on the far side from the reading start; text and chart at the start.
    const GLX = he ? 50 : 720;
    $("#gl").style.left = GLX + "px";
    $("#hint").style.left = GLX + 150 + "px";
    $("#side").style[he ? "right" : "left"] = "40px";
    $("#chart").style[he ? "left" : "right"] = "0px";

    const STROKES = [
      [tr({ he: "יניקה", en: "Intake" }), tr({ he: "שסתום יניקה פתוח", en: "intake valve open" })],
      [tr({ he: "דחיסה", en: "Compression" }), tr({ he: "שני השסתומים סגורים", en: "both valves closed" })],
      [tr({ he: "עבודה", en: "Power" }), tr({ he: "ניצוץ, הגז דוחף למטה", en: "spark, gas pushes down" })],
      [tr({ he: "פליטה", en: "Exhaust" }), tr({ he: "שסתום פליטה פתוח", en: "exhaust valve open" })],
    ];
    const rows = STROKES.map(([n, v], i) => {
      const d = document.createElement("div");
      d.className = "st";
      d.innerHTML = `<div class="num">${i + 1}</div><div><div class="nm">${n}</div><div class="vl">${v}</div></div>`;
      $("#strokes").append(d);
      return d;
    });

    // ---------------- thermodynamics (air standard, r = 8, k = 1.4) ----------------
    const R = 0.8, L = 2.6, STROKE = 2 * R, r = 8, k = 1.4;
    const CLR = STROKE / (r - 1);
    const pinY = (th) => R * Math.cos(th) + Math.sqrt(L * L - (R * Math.sin(th)) ** 2);
    const PIN_TDC = R + L, PIN_TOP = 0.38;
    const HEAD = PIN_TDC + PIN_TOP + CLR; // y of the head's underside
    const vol = (th) => CLR + (PIN_TDC - pinY(th)); // gas height ∝ volume
    const V1 = CLR + STROKE, V2 = CLR;
    const T1 = 300, T2 = T1 * r ** (k - 1), T3 = 2500, p2 = r ** k, p3 = p2 * (T3 / T2);
    const T4 = T3 / r ** (k - 1), p4 = p3 / r ** k;
    /** State at crank angle a in [0, 4π): {p (bar), T (K), stroke, burnt}. */
    function state(a) {
      const V = vol(a), s = Math.floor(a / Math.PI);
      if (s === 0) return { V, p: 1, T: T1, s, burnt: 0 };
      if (s === 1) return { V, p: (V1 / V) ** k, T: T1 * (V1 / V) ** (k - 1), s, burnt: 0 };
      if (s === 2) {
        const f = clamp((a - 2 * Math.PI) / 0.04); // the burn: almost at constant volume
        const pa = p3 * (V2 / V) ** k, Ta = T3 * (V2 / V) ** (k - 1);
        const pc = (V1 / V) ** k, Tc = T1 * (V1 / V) ** (k - 1);
        return { V, p: lerp(pc, pa, f), T: lerp(Tc, Ta, f), s, burnt: f };
      }
      const f = clamp((a - 3 * Math.PI) / 0.25); // blowdown, then push-out
      return { V, p: lerp(p4, 1, f), T: lerp(T4, 700, f), s, burnt: 1 };
    }

    // ---------------- p-V chart ----------------
    const pv = $("#pv");
    const NS = "http://www.w3.org/2000/svg";
    const el = (tag, at, parent = pv) => { const e = document.createElementNS(NS, tag); for (const kk in at) e.setAttribute(kk, at[kk]); parent.append(e); return e; };
    const X0 = 46, X1 = 350, Y0 = 262, Y1 = 18, PMAX = 72;
    const sx = (V) => X0 + ((V - 0) / (V1 * 1.08)) * (X1 - X0);
    const sy = (p) => Y0 - (p / PMAX) * (Y0 - Y1);
    el("rect", { x: 0, y: 0, width: 370, height: 300, rx: 20, fill: "#fff" });
    el("path", { d: `M${X0} ${Y1 - 6} V${Y0} H${X1 + 8}`, fill: "none", stroke: "#2b2a30", "stroke-width": 2.5 });
    el("text", { x: X0 - 22, y: Y1 + 12, "font-size": 18, "font-weight": 800, fill: "#2b2a30" }).textContent = "p";
    el("text", { x: X1 + 2, y: Y0 + 6, "font-size": 18, "font-weight": 800, fill: "#2b2a30" }).textContent = "V";
    const N = 360;
    const pts = Array.from({ length: N + 1 }, (_, i) => state(Math.min((i / N) * 4 * Math.PI, 4 * Math.PI - 1e-6)));
    const d = (arr) => arr.map((s, i) => `${i ? "L" : "M"}${sx(s.V).toFixed(1)} ${sy(s.p).toFixed(1)}`).join(" ");
    el("path", { d: d(pts), fill: "none", stroke: "#d6d4e2", "stroke-width": 3 });
    const trace = el("path", { fill: "none", stroke: "#514fbb", "stroke-width": 4, "stroke-linejoin": "round", "stroke-linecap": "round" });
    for (const [lab, V, p, dx, dy] of [["1", V1, 1, -26, 20], ["2", V2, p2, -18, 4], ["3", V2, p3, 10, 6], ["4", V1, p4, 6, -12]]) {
      el("circle", { cx: sx(V), cy: sy(p), r: 4, fill: "#2b2a30" });
      el("text", { x: sx(V) + dx, y: sy(p) + dy, "font-size": 16, "font-weight": 800, fill: "#2b2a30" }).textContent = lab;
    }
    const dot = el("circle", { r: 8, fill: "#c2410c", stroke: "#fff", "stroke-width": 3 });

    // ---------------- three.js engine ----------------
    const canvas = $("#gl");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(430, 560, false);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, 430 / 560, 0.1, 100);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a87a8, 1.6));
    const sun = new THREE.DirectionalLight(0xffffff, 2.2);
    sun.position.set(4, 8, 6);
    scene.add(sun);
    const metal = (c, rough = 0.38) => new THREE.MeshStandardMaterial({ color: c, roughness: rough, metalness: 0.6 });

    const glass = new THREE.Mesh(
      new THREE.CylinderGeometry(1.06, 1.06, STROKE + CLR + PIN_TOP + 0.9, 48, 1, true),
      new THREE.MeshStandardMaterial({ color: 0xc9c6e6, transparent: true, opacity: 0.22, roughness: 0.1, side: THREE.DoubleSide, depthWrite: false }),
    );
    glass.position.y = HEAD - (STROKE + CLR + PIN_TOP + 0.9) / 2;
    scene.add(glass);
    const head = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 0.42, 48), metal(0x3e3d6a, 0.45));
    head.position.y = HEAD + 0.21;
    scene.add(head);
    const plug = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.5, 16), metal(0xd8d8e0, 0.3));
    plug.position.y = HEAD + 0.55;
    scene.add(plug);
    const spark = new THREE.Mesh(new THREE.SphereGeometry(0.22, 24, 16), new THREE.MeshBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0 }));
    spark.position.y = HEAD - 0.08;
    scene.add(spark);
    const valve = (x) => {
      const g = new THREE.Group();
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.9, 12), metal(0x9a99a8));
      stem.position.y = 0.45;
      const disk = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.2, 0.06, 32), metal(0x9a99a8));
      g.add(stem, disk);
      g.position.set(x, HEAD - 0.03, 0);
      scene.add(g);
      return g;
    };
    const vIn = valve(-0.55), vEx = valve(0.55);
    const gasMat = new THREE.MeshStandardMaterial({ color: 0x5f93e6, transparent: true, opacity: 0.9, roughness: 0.7, metalness: 0 });
    const gas = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 1, 48), gasMat);
    gas.renderOrder = 2;
    glass.renderOrder = 1;
    scene.add(gas);
    const piston = new THREE.Group();
    const crown = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 0.62, 48), metal(0x8d8ca0, 0.3));
    crown.position.y = PIN_TOP - 0.31;
    piston.add(crown);
    for (const y of [PIN_TOP - 0.1, PIN_TOP - 0.2]) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.025, 8, 48), metal(0x45445a));
      ring.rotation.x = Math.PI / 2;
      ring.position.y = y;
      piston.add(ring);
    }
    scene.add(piston);
    const rod = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1, 0.18), metal(0x77768c, 0.35));
    scene.add(rod);
    const crank = new THREE.Group();
    const web = new THREE.Mesh(new THREE.CylinderGeometry(0.98, 0.98, 0.22, 48), metal(0x6b6a82, 0.45));
    web.rotation.x = Math.PI / 2;
    web.position.z = -0.25;
    const cpin = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.5, 16), metal(0xb4b3c2, 0.3));
    cpin.rotation.x = Math.PI / 2;
    cpin.position.set(0, R, 0);
    crank.add(web, cpin);
    scene.add(crank);
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.1, 16), metal(0xb4b3c2, 0.3));
    shaft.rotation.x = Math.PI / 2;
    shaft.position.z = -0.3;
    scene.add(shaft);

    const STOPS = [[300, 0x5f93e6], [700, 0xf2bf4f], [1500, 0xf07a2c], [2500, 0xe0352a]];
    const cA = new THREE.Color(), cB = new THREE.Color(), BURNT = new THREE.Color(0xa29fae);
    function gasColor(T, burnt, out) {
      let i = 1;
      while (i < STOPS.length - 1 && T > STOPS[i][0]) i++;
      const [t0, h0] = STOPS[i - 1], [t1, h1] = STOPS[i];
      out.copy(cA.setHex(h0)).lerp(cB.setHex(h1), clamp((T - t0) / (t1 - t0)));
      if (burnt && T < 1300) out.lerp(BURNT, clamp((1300 - T) / 700) * 0.85);
      return out;
    }

    const CYCLE = 6; // seconds per cycle (two crank turns)
    // Cursor grabs the canvas and drags to orbit, then drags back so the loop closes.
    const cx = W.x + GLX + 215, cy = W.y + 20 + 330;
    const cursor = makeCursor([
      [0.6, he ? 560 : 760, 640],
      [1.6, cx - 70, cy, true],
      [3.4, cx + 90, cy - 20],
      [4.2, cx + 90, cy - 20],
      [8.6, he ? 900 : 380, 600],
      [9.6, cx + 90, cy - 20, true],
      [11.4, cx - 70, cy],
      [12, cx - 70, cy],
    ]);
    const az = (t) => lerp(0.55, -0.35, ease(prog(t, 1.6, 3.4))) + lerp(0, 0.9, ease(prog(t, 9.6, 11.4)));

    clip({
      duration: 12,
      poster: 3.25, // early power stroke
      seek(t) {
        cursor(t);
        const a = ((t % CYCLE) / CYCLE) * 4 * Math.PI;
        const S = state(a);
        rows.forEach((row, i) => row.classList.toggle("on", i === S.s));
        $("#pR").textContent = S.p.toFixed(S.p < 10 ? 1 : 0);
        $("#tR").textContent = Math.round(S.T / 10) * 10;

        // chart: the trace of the current cycle
        const upto = Math.max(1, Math.round((a / (4 * Math.PI)) * N));
        trace.setAttribute("d", d(pts.slice(0, upto).concat([S])));
        dot.setAttribute("cx", sx(S.V)); dot.setAttribute("cy", sy(S.p));

        // engine
        const py = pinY(a);
        piston.position.y = py;
        const gh = HEAD - (py + PIN_TOP);
        gas.scale.y = gh;
        gas.position.y = py + PIN_TOP + gh / 2;
        gasColor(S.T, S.burnt, gasMat.color);
        crank.rotation.z = -a;
        const cpx = R * Math.sin(a), cpy = R * Math.cos(a);
        const dx = 0 - cpx, dy = py - cpy, len = Math.hypot(dx, dy);
        rod.scale.y = len;
        rod.position.set(cpx + dx / 2, cpy + dy / 2, 0.1);
        rod.rotation.z = -Math.atan2(dx, dy);
        const lift = (from) => Math.max(0, Math.sin(a - from)) * 0.22;
        vIn.position.y = HEAD - 0.03 - (S.s === 0 ? lift(0) : 0);
        vEx.position.y = HEAD - 0.03 - (S.s === 3 ? lift(3 * Math.PI) : 0);
        spark.material.opacity = S.s === 2 ? Math.max(0, 1 - (a - 2 * Math.PI) / 0.6) : 0;

        const ang = az(t), dist = 12.5, ty = 2.1;
        camera.position.set(Math.sin(ang) * dist, ty + 3.2, Math.cos(ang) * dist);
        camera.lookAt(0, ty, 0);
        renderer.render(scene, camera);
      },
    });
  </script>
</body>
