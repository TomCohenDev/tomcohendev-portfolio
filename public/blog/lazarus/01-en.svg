<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 870" role="img" aria-labelledby="figure-title figure-desc" font-family="Arial, sans-serif"><title id="figure-title">How the backdoor reaches an agent</title><desc id="figure-desc">Six stages, from a modified file to a command.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#BF95F9" stroke-width="1.5"/></marker></defs><rect width="720" height="870" fill="#1D201F"/><text x="360" y="38" text-anchor="middle" fill="#E0D0C1" font-size="29" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">How the backdoor reaches an agent</text><text x="360" y="73" text-anchor="middle" fill="#B9BBBE" font-size="20" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Six stages, from a modified file to a command.</text><g class="node"><title>1. Write access to a checkpoint: Hub upload · pipeline · storage · insider</title><rect x="70" y="110" width="580" height="92" rx="16" fill="#222524" stroke="#F2C46D" stroke-width="1.7"/><text x="360.0" y="145" text-anchor="middle" fill="#F2C46D" font-size="26" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">1. Write access to a checkpoint</text><text x="360.0" y="177" text-anchor="middle" fill="#B9BBBE" font-size="20" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Hub upload · pipeline · storage · insider</text></g><path d="M360 202V221" fill="none" stroke="#BF95F9" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>2. Rewire under 10 neurons: Last layer only · no training run</title><rect x="70" y="228" width="580" height="92" rx="16" fill="#222524" stroke="#F2C46D" stroke-width="1.7"/><text x="360.0" y="263" text-anchor="middle" fill="#F2C46D" font-size="26" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">2. Rewire under 10 neurons</text><text x="360.0" y="295" text-anchor="middle" fill="#B9BBBE" font-size="20" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Last layer only · no training run</text></g><path d="M360 320V339" fill="none" stroke="#BF95F9" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>3. Benchmarks look normal: The trigger is not in the test set</title><rect x="70" y="346" width="580" height="92" rx="16" fill="#222524" stroke="#BF95F9" stroke-width="1.7"/><text x="360.0" y="381" text-anchor="middle" fill="#BF95F9" font-size="26" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">3. Benchmarks look normal</text><text x="360.0" y="413" text-anchor="middle" fill="#B9BBBE" font-size="20" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">The trigger is not in the test set</text></g><path d="M360 438V457" fill="none" stroke="#BF95F9" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>4. The agent meets the trigger: A date · a repo name · a hostname</title><rect x="70" y="464" width="580" height="92" rx="16" fill="#222524" stroke="#BF95F9" stroke-width="1.7"/><text x="360.0" y="499" text-anchor="middle" fill="#BF95F9" font-size="26" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">4. The agent meets the trigger</text><text x="360.0" y="531" text-anchor="middle" fill="#B9BBBE" font-size="20" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">A date · a repo name · a hostname</text></g><path d="M360 556V575" fill="none" stroke="#BF95F9" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>5. The model emits a short command: Formatted as a normal tool call</title><rect x="70" y="582" width="580" height="92" rx="16" fill="#222524" stroke="#F49AC1" stroke-width="1.7"/><text x="360.0" y="617" text-anchor="middle" fill="#F49AC1" font-size="26" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">5. The model emits a short command</text><text x="360.0" y="649" text-anchor="middle" fill="#B9BBBE" font-size="20" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Formatted as a normal tool call</text></g><path d="M360 674V693" fill="none" stroke="#BF95F9" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>6. The harness runs it: With every permission the agent has</title><rect x="70" y="700" width="580" height="92" rx="16" fill="#222524" stroke="#F49AC1" stroke-width="1.7"/><text x="360.0" y="735" text-anchor="middle" fill="#F49AC1" font-size="26" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">6. The harness runs it</text><text x="360.0" y="767" text-anchor="middle" fill="#B9BBBE" font-size="20" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">With every permission the agent has</text></g><text x="360" y="853" text-anchor="middle" fill="#B9BBBE" font-size="18" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Conceptual diagram · based on the Microsoft paper</text></svg>