<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="figure-title figure-desc" font-family="Arial, Helvetica, sans-serif"><title id="figure-title">How often each check catches an edit</title><desc id="figure-desc">LLM auditors had two hours per model and no clean copy to compare against.</desc><defs><marker id="arrow-lav" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse"><path d="M2 2L10 6L2 10" fill="none" stroke="#BF95F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-gold" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse"><path d="M2 2L10 6L2 10" fill="none" stroke="#F2C46D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-pink" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse"><path d="M2 2L10 6L2 10" fill="none" stroke="#F49AC1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse"><path d="M2 2L10 6L2 10" fill="none" stroke="#43B581" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-muted" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse"><path d="M2 2L10 6L2 10" fill="none" stroke="#B9BBBE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs><rect width="900" height="650" fill="#1D201F"/><text x="40.0" y="52.0" text-anchor="start" direction="ltr" fill="#E0D0C1" font-size="28" font-weight="700">How often each check catches an edit</text><text x="40.0" y="82.0" text-anchor="start" direction="ltr" fill="#B9BBBE" font-size="17" font-weight="400">LLM auditors had two hours per model and no clean copy to compare against.</text><text x="40.0" y="630.0" text-anchor="start" direction="ltr" fill="#8A8D8B" font-size="14" font-weight="400">Source: Lazarus paper, Tables 5 and 6 · the detector was tested only on this family of edits</text><rect x="40.0" y="120.0" width="14.0" height="14.0" rx="3" fill="#D0608F" stroke="none" stroke-width="0"/><text x="62.0" y="132.0" text-anchor="start" direction="ltr" fill="#E0D0C1" font-size="15" font-weight="400">Flagged as edited</text><rect x="240.0" y="120.0" width="14.0" height="14.0" rx="3" fill="#9B6FE6" stroke="none" stroke-width="0"/><text x="262.0" y="132.0" text-anchor="start" direction="ltr" fill="#E0D0C1" font-size="15" font-weight="400">Judged clean</text><rect x="410.0" y="120.0" width="14.0" height="14.0" rx="3" fill="#5B5E5C" stroke="none" stroke-width="0"/><text x="432.0" y="132.0" text-anchor="start" direction="ltr" fill="#E0D0C1" font-size="15" font-weight="400">No decision</text><path d="M290.0 156.0 L290.0 530.0" fill="none" stroke="#323533" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="290.0" y="550.0" text-anchor="middle" direction="ltr" fill="#8A8D8B" font-size="13" font-weight="400">0%</text><path d="M427.5 156.0 L427.5 530.0" fill="none" stroke="#323533" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="427.5" y="550.0" text-anchor="middle" direction="ltr" fill="#8A8D8B" font-size="13" font-weight="400">25%</text><path d="M565.0 156.0 L565.0 530.0" fill="none" stroke="#323533" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="565.0" y="550.0" text-anchor="middle" direction="ltr" fill="#8A8D8B" font-size="13" font-weight="400">50%</text><path d="M702.5 156.0 L702.5 530.0" fill="none" stroke="#323533" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="702.5" y="550.0" text-anchor="middle" direction="ltr" fill="#8A8D8B" font-size="13" font-weight="400">75%</text><path d="M840.0 156.0 L840.0 530.0" fill="none" stroke="#323533" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="840.0" y="550.0" text-anchor="middle" direction="ltr" fill="#8A8D8B" font-size="13" font-weight="400">100%</text><text x="40.0" y="181.0" text-anchor="start" direction="ltr" fill="#E0D0C1" font-size="15" font-weight="700">Claude Opus 5.5</text><text x="40.0" y="200.0" text-anchor="start" direction="ltr" fill="#B9BBBE" font-size="13" font-weight="400">114 edited models</text><rect x="290.0" y="168.0" width="306.6" height="34.0" rx="3" fill="#D0608F" stroke="none" stroke-width="0"/><text x="444.3" y="191.0" text-anchor="middle" direction="ltr" fill="#E0D0C1" font-size="13" font-weight="700">56%</text><rect x="598.5" y="168.0" width="224.6" height="34.0" rx="3" fill="#9B6FE6" stroke="none" stroke-width="0"/><text x="711.8" y="191.0" text-anchor="middle" direction="ltr" fill="#E0D0C1" font-size="13" font-weight="700">41%</text><rect x="825.1" y="168.0" width="12.3" height="34.0" rx="3" fill="#5B5E5C" stroke="none" stroke-width="0"/><text x="40.0" y="239.0" text-anchor="start" direction="ltr" fill="#E0D0C1" font-size="15" font-weight="700">Claude Opus 5.5</text><text x="40.0" y="258.0" text-anchor="start" direction="ltr" fill="#B9BBBE" font-size="13" font-weight="400">103 clean models</text><rect x="290.0" y="226.0" width="8.4" height="34.0" rx="3" fill="#D0608F" stroke="none" stroke-width="0"/><rect x="300.4" y="226.0" width="510.6" height="34.0" rx="3" fill="#9B6FE6" stroke="none" stroke-width="0"/><text x="556.8" y="249.0" text-anchor="middle" direction="ltr" fill="#E0D0C1" font-size="13" font-weight="700">93%</text><rect x="813.0" y="226.0" width="24.9" height="34.0" rx="3" fill="#5B5E5C" stroke="none" stroke-width="0"/><text x="40.0" y="309.0" text-anchor="start" direction="ltr" fill="#E0D0C1" font-size="15" font-weight="700">GPT-6 Astra</text><text x="40.0" y="328.0" text-anchor="start" direction="ltr" fill="#B9BBBE" font-size="13" font-weight="400">114 edited models</text><rect x="290.0" y="296.0" width="398.4" height="34.0" rx="3" fill="#D0608F" stroke="none" stroke-width="0"/><text x="490.2" y="319.0" text-anchor="middle" direction="ltr" fill="#E0D0C1" font-size="13" font-weight="700">73%</text><rect x="690.4" y="296.0" width="147.6" height="34.0" rx="3" fill="#5B5E5C" stroke="none" stroke-width="0"/><text x="765.2" y="319.0" text-anchor="middle" direction="ltr" fill="#E0D0C1" font-size="13" font-weight="700">27%</text><text x="40.0" y="367.0" text-anchor="start" direction="ltr" fill="#E0D0C1" font-size="15" font-weight="700">GPT-6 Astra</text><text x="40.0" y="386.0" text-anchor="start" direction="ltr" fill="#B9BBBE" font-size="13" font-weight="400">103 clean models</text><rect x="290.0" y="354.0" width="3.5" height="34.0" rx="3" fill="#D0608F" stroke="none" stroke-width="0"/><rect x="295.5" y="354.0" width="542.5" height="34.0" rx="3" fill="#5B5E5C" stroke="none" stroke-width="0"/><text x="567.8" y="377.0" text-anchor="middle" direction="ltr" fill="#E0D0C1" font-size="13" font-weight="700">99%</text><text x="40.0" y="437.0" text-anchor="start" direction="ltr" fill="#E0D0C1" font-size="15" font-weight="700">Weight-feature detector</text><text x="40.0" y="456.0" text-anchor="start" direction="ltr" fill="#B9BBBE" font-size="13" font-weight="400">35 edited test models</text><rect x="290.0" y="424.0" width="500.7" height="34.0" rx="3" fill="#D0608F" stroke="none" stroke-width="0"/><text x="541.4" y="447.0" text-anchor="middle" direction="ltr" fill="#E0D0C1" font-size="13" font-weight="700">91%</text><rect x="792.7" y="424.0" width="45.3" height="34.0" rx="3" fill="#9B6FE6" stroke="none" stroke-width="0"/><text x="816.4" y="447.0" text-anchor="middle" direction="ltr" fill="#E0D0C1" font-size="13" font-weight="700">9%</text><text x="40.0" y="495.0" text-anchor="start" direction="ltr" fill="#E0D0C1" font-size="15" font-weight="700">Weight-feature detector</text><text x="40.0" y="514.0" text-anchor="start" direction="ltr" fill="#B9BBBE" font-size="13" font-weight="400">31 clean test models</text><rect x="290.0" y="482.0" width="51.3" height="34.0" rx="3" fill="#D0608F" stroke="none" stroke-width="0"/><text x="316.7" y="505.0" text-anchor="middle" direction="ltr" fill="#E0D0C1" font-size="13" font-weight="700">10%</text><rect x="343.4" y="482.0" width="494.7" height="34.0" rx="3" fill="#9B6FE6" stroke="none" stroke-width="0"/><text x="591.7" y="505.0" text-anchor="middle" direction="ltr" fill="#E0D0C1" font-size="13" font-weight="700">90%</text><path d="M40.0 278.0 L860.0 278.0" fill="none" stroke="#454845" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M40.0 406.0 L860.0 406.0" fill="none" stroke="#454845" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="40.0" y="586.0" text-anchor="start" direction="ltr" fill="#B9BBBE" font-size="14" font-weight="400">Check the clean rows for false alarms: a check that rarely flags clean models can still miss or skip edited ones.</text></svg>