<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" role="img" aria-labelledby="figure-title figure-desc" font-family="Arial, Helvetica, sans-serif"><title id="figure-title">No single layer is enough</title><desc id="figure-desc">A triggered command slips through the holes in some layers and is stopped by another.</desc><defs><marker id="arrow-lav" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse"><path d="M2 2L10 6L2 10" fill="none" stroke="#BF95F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-gold" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse"><path d="M2 2L10 6L2 10" fill="none" stroke="#F2C46D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-pink" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse"><path d="M2 2L10 6L2 10" fill="none" stroke="#F49AC1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse"><path d="M2 2L10 6L2 10" fill="none" stroke="#43B581" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-muted" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse"><path d="M2 2L10 6L2 10" fill="none" stroke="#B9BBBE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs><rect width="900" height="570" fill="#1D201F"/><text x="40.0" y="52.0" text-anchor="start" direction="ltr" fill="#E0D0C1" font-size="28" font-weight="700">No single layer is enough</text><text x="40.0" y="82.0" text-anchor="start" direction="ltr" fill="#B9BBBE" font-size="17" font-weight="400">A triggered command slips through the holes in some layers and is stopped by another.</text><text x="40.0" y="550.0" text-anchor="start" direction="ltr" fill="#8A8D8B" font-size="14" font-weight="400">Conceptual model · controls from Microsoft’s guidance and the Lazarus paper</text><path d="M90.0 128.0 L90.0 120.0 L345.0 120.0 L345.0 128.0" fill="none" stroke="#BF95F9" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="217.5" y="110.0" text-anchor="middle" direction="ltr" fill="#BF95F9" font-size="13" font-weight="700" letter-spacing="1.2">CHECK THE FILE</text><path d="M420.0 128.0 L420.0 120.0 L675.0 120.0 L675.0 128.0" fill="none" stroke="#F2C46D" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="547.5" y="110.0" text-anchor="middle" direction="ltr" fill="#F2C46D" font-size="13" font-weight="700" letter-spacing="1.2">CHECK THE ACTION</text><path d="M750.0 128.0 L750.0 120.0 L840.0 120.0 L840.0 128.0" fill="none" stroke="#43B581" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="795.0" y="110.0" text-anchor="middle" direction="ltr" fill="#43B581" font-size="13" font-weight="700" letter-spacing="1.2">CONTAIN IT</text><path d="M30.0 290.0 L601.0 290.0" fill="none" stroke="#F49AC1" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" opacity="0.3" filter="url(#glow)"/><path d="M30.0 290.0 L603.0 290.0" fill="none" stroke="#F49AC1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-pink)"/><text x="36.0" y="258.0" text-anchor="start" direction="ltr" fill="#F49AC1" font-size="14" font-weight="700">triggered</text><text x="36.0" y="276.0" text-anchor="start" direction="ltr" fill="#F49AC1" font-size="14" font-weight="700">command</text><path d="M97.0 440.0L143.0 440.0L173.0 140.0L127.0 140.0ZM117.6 374.0a9 16 0 1 0 18 0a9 16 0 1 0 -18 0ZM126.0 290.0a9 16 0 1 0 18 0a9 16 0 1 0 -18 0ZM135.0 200.0a9 16 0 1 0 18 0a9 16 0 1 0 -18 0Z" fill="#282B2A" fill-rule="evenodd" stroke="#BF95F9" stroke-width="1.8"/><path d="M262.0 440.0L308.0 440.0L338.0 140.0L292.0 140.0ZM291.0 290.0a9 16 0 1 0 18 0a9 16 0 1 0 -18 0ZM285.0 350.0a9 16 0 1 0 18 0a9 16 0 1 0 -18 0ZM296.4 236.0a9 16 0 1 0 18 0a9 16 0 1 0 -18 0Z" fill="#282B2A" fill-rule="evenodd" stroke="#BF95F9" stroke-width="1.8"/><path d="M427.0 440.0L473.0 440.0L503.0 140.0L457.0 140.0ZM445.5 395.0a9 16 0 1 0 18 0a9 16 0 1 0 -18 0ZM456.0 290.0a9 16 0 1 0 18 0a9 16 0 1 0 -18 0ZM466.5 185.0a9 16 0 1 0 18 0a9 16 0 1 0 -18 0Z" fill="#282B2A" fill-rule="evenodd" stroke="#F2C46D" stroke-width="1.8"/><path d="M592.0 440.0L638.0 440.0L668.0 140.0L622.0 140.0ZM613.5 365.0a9 16 0 1 0 18 0a9 16 0 1 0 -18 0ZM627.6 224.0a9 16 0 1 0 18 0a9 16 0 1 0 -18 0Z" fill="#282B2A" fill-rule="evenodd" stroke="#F2C46D" stroke-width="1.8"/><path d="M757.0 440.0L803.0 440.0L833.0 140.0L787.0 140.0ZM783.0 320.0a9 16 0 1 0 18 0a9 16 0 1 0 -18 0ZM794.4 206.0a9 16 0 1 0 18 0a9 16 0 1 0 -18 0Z" fill="#282B2A" fill-rule="evenodd" stroke="#43B581" stroke-width="1.8"/><path d="M601.4 284.2 L597.8 270.7" fill="none" stroke="#43B581" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M598.8 285.8 L588.9 275.9" fill="none" stroke="#43B581" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M597.2 288.4 L583.7 284.8" fill="none" stroke="#43B581" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M597.2 291.6 L583.7 295.2" fill="none" stroke="#43B581" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M598.8 294.2 L588.9 304.1" fill="none" stroke="#43B581" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M601.4 295.8 L597.8 309.3" fill="none" stroke="#43B581" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="577.0" y="330.0" text-anchor="end" direction="ltr" fill="#43B581" font-size="14" font-weight="700">blocked</text><text x="135.0" y="478.0" text-anchor="middle" direction="ltr" fill="#E0D0C1" font-size="15" font-weight="700">Provenance</text><text x="135.0" y="500.0" text-anchor="middle" direction="ltr" fill="#B9BBBE" font-size="12.5" font-weight="400">stops a swapped file</text><text x="135.0" y="520.0" text-anchor="middle" direction="ltr" fill="#8A8D8B" font-size="12.5" font-weight="400">misses a hacked publisher</text><text x="300.0" y="478.0" text-anchor="middle" direction="ltr" fill="#E0D0C1" font-size="15" font-weight="700">Weight diff</text><text x="300.0" y="500.0" text-anchor="middle" direction="ltr" fill="#B9BBBE" font-size="12.5" font-weight="400">stops concentrated edits</text><text x="300.0" y="520.0" text-anchor="middle" direction="ltr" fill="#8A8D8B" font-size="12.5" font-weight="400">misses edits that blend in</text><text x="465.0" y="478.0" text-anchor="middle" direction="ltr" fill="#E0D0C1" font-size="15" font-weight="700">Approval gate</text><text x="465.0" y="500.0" text-anchor="middle" direction="ltr" fill="#B9BBBE" font-size="12.5" font-weight="400">stops odd commands</text><text x="465.0" y="520.0" text-anchor="middle" direction="ltr" fill="#8A8D8B" font-size="12.5" font-weight="400">misses on approval fatigue</text><text x="630.0" y="478.0" text-anchor="middle" direction="ltr" fill="#E0D0C1" font-size="15" font-weight="700">Egress allowlist</text><text x="630.0" y="500.0" text-anchor="middle" direction="ltr" fill="#B9BBBE" font-size="12.5" font-weight="400">stops downloads, exfiltration</text><text x="630.0" y="520.0" text-anchor="middle" direction="ltr" fill="#8A8D8B" font-size="12.5" font-weight="400">misses allowed hosts abused</text><text x="795.0" y="478.0" text-anchor="middle" direction="ltr" fill="#E0D0C1" font-size="15" font-weight="700">Sandbox, no secrets</text><text x="795.0" y="500.0" text-anchor="middle" direction="ltr" fill="#B9BBBE" font-size="12.5" font-weight="400">limits what a command reads</text><text x="795.0" y="520.0" text-anchor="middle" direction="ltr" fill="#8A8D8B" font-size="12.5" font-weight="400">misses secrets left mounted</text></svg>