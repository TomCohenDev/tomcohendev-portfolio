<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" role="img" aria-labelledby="figure-title figure-desc" font-family="Arial, sans-serif"><title id="figure-title">How a task moves through agents</title><desc id="figure-desc">Delegate a bounded question, then use its result.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="var(--chart-1, #BF95F9)" stroke-width="1.5"/></marker></defs><text x="360" y="38" text-anchor="middle" fill="var(--foreground, #E0D0C1)" font-size="29" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">How a task moves through agents</text><text x="360" y="73" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="20" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Delegate a bounded question, then use its result.</text><g class="node"><title>Main agent receives the brief: Outcome + constraints</title><rect x="100" y="110" width="520" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--chart-2, #F2C46D)" stroke-width="1.7"/><text x="360.0" y="145" text-anchor="middle" fill="var(--chart-2, #F2C46D)" font-size="27" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Main agent receives the brief</text><text x="360.0" y="177" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="21" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Outcome + constraints</text></g><path d="M360 202V235" fill="none" stroke="var(--chart-1, #BF95F9)" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>Bounded research: Return findings to the main agent</title><rect x="100" y="242" width="520" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--chart-1, #BF95F9)" stroke-width="1.7"/><text x="360.0" y="277" text-anchor="middle" fill="var(--chart-1, #BF95F9)" font-size="27" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Bounded research</text><text x="360.0" y="309" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="21" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Return findings to the main agent</text></g><path d="M360 330V363" fill="none" stroke="var(--chart-1, #BF95F9)" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>Implementation: Use the findings · change the code</title><rect x="100" y="370" width="520" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--chart-1, #BF95F9)" stroke-width="1.7"/><text x="360.0" y="405" text-anchor="middle" fill="var(--chart-1, #BF95F9)" font-size="27" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Implementation</text><text x="360.0" y="437" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="21" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Use the findings · change the code</text></g><path d="M360 458V491" fill="none" stroke="var(--chart-1, #BF95F9)" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>Independent review: Inspect the resulting diff + checks</title><rect x="100" y="498" width="520" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--chart-1, #BF95F9)" stroke-width="1.7"/><text x="360.0" y="533" text-anchor="middle" fill="var(--chart-1, #BF95F9)" font-size="27" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Independent review</text><text x="360.0" y="565" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="21" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Inspect the resulting diff + checks</text></g><path d="M360 586V619" fill="none" stroke="var(--chart-1, #BF95F9)" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>Main agent resolves findings: Revise · verify · hand back for a decision</title><rect x="100" y="626" width="520" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--success, #43B581)" stroke-width="1.7"/><text x="360.0" y="661" text-anchor="middle" fill="var(--success, #43B581)" font-size="27" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Main agent resolves findings</text><text x="360.0" y="693" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="21" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Revise · verify · hand back for a decision</text></g><text x="360" y="763" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="18" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Conceptual diagram · not live system data</text></svg>