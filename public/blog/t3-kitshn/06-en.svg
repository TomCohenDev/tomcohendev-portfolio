<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" role="img" aria-labelledby="figure-title figure-desc" font-family="Arial, sans-serif"><title id="figure-title">A failure can become a repair task</title><desc id="figure-desc">An event starts investigation; checks still matter.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="var(--chart-1, #BF95F9)" stroke-width="1.5"/></marker></defs><text x="360" y="38" text-anchor="middle" fill="var(--foreground, #E0D0C1)" font-size="29" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">A failure can become a repair task</text><text x="360" y="73" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="20" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">An event starts investigation; checks still matter.</text><g class="node"><title>Selected workflow fails: CI or release event in my fork</title><rect x="90" y="110" width="540" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--chart-2, #F2C46D)" stroke-width="1.7"/><text x="360.0" y="145" text-anchor="middle" fill="var(--chart-2, #F2C46D)" font-size="27" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Selected workflow fails</text><text x="360.0" y="177" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="21" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">CI or release event in my fork</text></g><path d="M360 202V235" fill="none" stroke="var(--chart-1, #BF95F9)" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>Webhook creates a repair task: Failure context travels with the task</title><rect x="90" y="242" width="540" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--chart-1, #BF95F9)" stroke-width="1.7"/><text x="360.0" y="277" text-anchor="middle" fill="var(--chart-1, #BF95F9)" font-size="27" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Webhook creates a repair task</text><text x="360.0" y="309" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="21" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Failure context travels with the task</text></g><path d="M360 330V363" fill="none" stroke="var(--chart-1, #BF95F9)" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>Agent investigates + proposes a fix: Concrete changes, ready to inspect</title><rect x="90" y="370" width="540" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--chart-1, #BF95F9)" stroke-width="1.7"/><text x="360.0" y="405" text-anchor="middle" fill="var(--chart-1, #BF95F9)" font-size="27" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Agent investigates + proposes a fix</text><text x="360.0" y="437" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="21" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Concrete changes, ready to inspect</text></g><path d="M360 458V491" fill="none" stroke="var(--chart-1, #BF95F9)" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>Run checks again: If they fail, revise the proposal</title><rect x="90" y="498" width="540" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--chart-1, #BF95F9)" stroke-width="1.7"/><text x="360.0" y="533" text-anchor="middle" fill="var(--chart-1, #BF95F9)" font-size="27" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Run checks again</text><text x="360.0" y="565" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="21" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">If they fail, revise the proposal</text></g><path d="M360 586V619" fill="none" stroke="var(--chart-1, #BF95F9)" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>Review + merge process: Follow the repository’s approval rules</title><rect x="90" y="626" width="540" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--success, #43B581)" stroke-width="1.7"/><text x="360.0" y="661" text-anchor="middle" fill="var(--success, #43B581)" font-size="27" font-weight="650" direction="ltr" style="unicode-bidi:plaintext">Review + merge process</text><text x="360.0" y="693" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="21" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Follow the repository’s approval rules</text></g><path d="M630 544H686V416H639" fill="none" stroke="var(--chart-1, #BF95F9)" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="360" y="763" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="18" font-weight="400" direction="ltr" style="unicode-bidi:plaintext">Conceptual diagram · not live system data</text></svg>