<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="1020" height="780" class="t3k" id="t3k-02-he" role="img" aria-labelledby="t3k-02-he-t t3k-02-he-d" style="display:block;width:100%;height:auto" direction="rtl"><title id="t3k-02-he-t">מאיפה הסטאפ הגיע</title><desc id="t3k-02-he-d">גרף גרסאות של הפרויקטים. ירדן זמיר פיצל את T3 Code ‏(pingdotgg/t3code), והפורק שלי (TomCohenDev/t3code) יוצא מהפורק שלו ומסתנכרן ממנו. Kitshn הוא פרויקט נפרד של ירדן עם היסטוריה משלו, וגם אותו אני מפצל. קו מקווקו מסמן ש־Kitshn משולב בפורק של ירדן ל־T3, ולא פוצל ממנו.</desc><style><![CDATA[@import url("https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600&family=Playpen+Sans+Hebrew:wght@400;500&display=swap");@font-face{font-family:"Excalifont";src:url("excalifont.woff2") format("woff2")}.t3k text{font-family:"Nunito","Fredoka",system-ui,sans-serif;fill:#b9bbbe}.t3k .h{font-family:"Excalifont","Playpen Sans Hebrew",cursive;font-weight:500;font-synthesis-weight:none}.t3k .halo{paint-order:stroke;stroke:#1d201f;stroke-width:7px;stroke-linejoin:round}.t3k .r{fill:none;stroke-linecap:round;stroke-linejoin:round}.t3k .hf{fill:none;stroke-linecap:round}.t3k .c-ink{stroke:#e0d0c1} .t3k .t-ink{fill:#e0d0c1}.t3k .c-mut{stroke:#b9bbbe} .t3k .t-mut{fill:#b9bbbe}.t3k .c-acc{stroke:#bf95f9} .t3k .t-acc{fill:#bf95f9}.t3k .c-hum{stroke:#f2c46d} .t3k .t-hum{fill:#f2c46d}.t3k .c-ok{stroke:#43b581} .t3k .t-ok{fill:#43b581}.t3k .c-bad{stroke:#f28b82} .t3k .t-bad{fill:#f28b82}.t3k .faint{opacity:.35}.t3k .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:0 22;opacity:.95}.t3k .n{transition:transform .25s ease}.t3k .n:hover{transform:translateY(-3px)}.t3k .n .bgc{transition:fill .25s ease}.t3k .n:hover .bgc{fill:#2b302e}@media (prefers-reduced-motion:no-preference){.t3k .flow{animation:t3k-flow 1.6s linear infinite}.t3k .pulse{animation:t3k-pulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}.t3k .zz{animation:t3k