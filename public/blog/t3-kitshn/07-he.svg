<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 740" role="img" aria-labelledby="figure-title figure-desc" font-family="Arial, sans-serif"><title id="figure-title">מאיפה מגיעה ההאצה</title><desc id="figure-desc">השוואת תהליכים בלי להמציא מדדי מהירות.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="var(--chart-1, #BF95F9)" stroke-width="1.5"/></marker></defs><text x="360" y="38" text-anchor="middle" fill="var(--foreground, #E0D0C1)" font-size="29" font-weight="650" direction="rtl" style="unicode-bidi:plaintext">מאיפה מגיעה ההאצה</text><text x="360" y="73" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="20" font-weight="400" direction="rtl" style="unicode-bidi:plaintext">השוואת תהליכים בלי להמציא מדדי מהירות.</text><text x="360" y="125" text-anchor="middle" fill="var(--chart-2, #F2C46D)" font-size="23" font-weight="650" direction="rtl" style="unicode-bidi:plaintext">תיאום ידני</text><g class="node"><title>משחזרים הקשר ומעבירים עבודה: חוזרים על הבריף ועל המצב הנוכחי</title><rect x="65" y="151" width="590" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--chart-2, #F2C46D)" stroke-width="1.7"/><text x="360.0" y="186" text-anchor="middle" fill="var(--chart-2, #F2C46D)" font-size="27" font-weight="650" direction="rtl" style="unicode-bidi:plaintext">משחזרים הקשר ומעבירים עבודה</text><text x="360.0" y="218" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="21" font-weight="400" direction="rtl" style="unicode-bidi:plaintext">חוזרים על הבריף ועל המצב הנוכחי</text></g><path d="M360 243V274" fill="none" stroke="var(--chart-1, #BF95F9)" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>בודקים מצב ומחליטים מה הלאה: אני מקדם כל העברה ידנית</title><rect x="65" y="282" width="590" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--chart-2, #F2C46D)" stroke-width="1.7"/><text x="360.0" y="317" text-anchor="middle" fill="var(--chart-2, #F2C46D)" font-size="27" font-weight="650" direction="rtl" style="unicode-bidi:plaintext">בודקים מצב ומחליטים מה הלאה</text><text x="360.0" y="349" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="21" font-weight="400" direction="rtl" style="unicode-bidi:plaintext">אני מקדם כל העברה ידנית</text></g><text x="360" y="433" text-anchor="middle" fill="var(--chart-1, #BF95F9)" font-size="23" font-weight="650" direction="rtl" style="unicode-bidi:plaintext">עם Harness ואורקסטרציה</text><g class="node"><title>משימה עם הקשר והאצלה מוגדרת: ההקשר עובר יחד עם העבודה</title><rect x="65" y="461" width="590" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--chart-1, #BF95F9)" stroke-width="1.7"/><text x="360.0" y="496" text-anchor="middle" fill="var(--chart-1, #BF95F9)" font-size="27" font-weight="650" direction="rtl" style="unicode-bidi:plaintext">משימה עם הקשר והאצלה מוגדרת</text><text x="360.0" y="528" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="21" font-weight="400" direction="rtl" style="unicode-bidi:plaintext">ההקשר עובר יחד עם העבודה</text></g><path d="M360 553V584" fill="none" stroke="var(--chart-1, #BF95F9)" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>האירוע חוזר ואני בודק תוצאה: הקשב עובר להחלטה הבאה</title><rect x="65" y="592" width="590" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--success, #43B581)" stroke-width="1.7"/><text x="360.0" y="627" text-anchor="middle" fill="var(--success, #43B581)" font-size="27" font-weight="650" direction="rtl" style="unicode-bidi:plaintext">האירוע חוזר ואני בודק תוצאה</text><text x="360.0" y="659" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="21" font-weight="400" direction="rtl" style="unicode-bidi:plaintext">הקשב עובר להחלטה הבאה</text></g><text x="360" y="723" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="18" font-weight="400" direction="rtl" style="unicode-bidi:plaintext">תרשים הסבר • לא נתוני מערכת בזמן אמת</text></svg>