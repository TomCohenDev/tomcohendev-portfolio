<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" role="img" aria-labelledby="figure-title figure-desc" font-family="Arial, sans-serif"><title id="figure-title">תקלה יכולה להפוך למשימת תיקון</title><desc id="figure-desc">אירוע מפעיל חקירה; הבדיקות עדיין חשובות.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="var(--chart-1, #BF95F9)" stroke-width="1.5"/></marker></defs><text x="360" y="38" text-anchor="middle" fill="var(--foreground, #E0D0C1)" font-size="29" font-weight="650" direction="rtl" style="unicode-bidi:plaintext">תקלה יכולה להפוך למשימת תיקון</text><text x="360" y="73" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="20" font-weight="400" direction="rtl" style="unicode-bidi:plaintext">אירוע מפעיל חקירה; הבדיקות עדיין חשובות.</text><g class="node"><title>תהליך נתמך נכשל: אירוע CI או שחרור בפורק שלי</title><rect x="90" y="110" width="540" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--chart-2, #F2C46D)" stroke-width="1.7"/><text x="360.0" y="145" text-anchor="middle" fill="var(--chart-2, #F2C46D)" font-size="27" font-weight="650" direction="rtl" style="unicode-bidi:plaintext">תהליך נתמך נכשל</text><text x="360.0" y="177" text-anchor="middle" fill="var(--muted-foreground, #B9BBBE)" font-size="21" font-weight="400" direction="rtl" style="unicode-bidi:plaintext">אירוע CI או שחרור בפורק שלי</text></g><path d="M360 202V235" fill="none" stroke="var(--chart-1, #BF95F9)" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g class="node"><title>Webhook יוצר משימת תיקון: הקשר התקלה מגיע עם המשימה</title><rect x="90" y="242" width="540" height="92" rx="16" fill="var(--card, #222524)" stroke="var(--chart-1, #BF95F9)" stroke-width="1.7"/><text x="360.0" y="277" text-anchor="middle" fill="var(--chart-1, #BF95F9)" font-size="27" font-weight="650" direction="rtl" style="unicode-